name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile simulation
        run: python -m py_compile spatial_void.py thronglet_research.py
      - name: Test research archive
        run: python -m unittest discover -s tests -v
